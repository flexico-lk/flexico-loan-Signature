<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Ez Credit App</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    font-family: system-ui, Arial;
    background: #eaeef3;
}

.app {
    max-width: 420px;
    margin: auto;
    min-height: 100svh;
    background: #fff;
    display: flex;
    flex-direction: column;
}

.content {
    padding: 16px;
    flex: 1;
}

h3 { text-align: center; }

label {
    margin-top: 14px;
    display: block;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
}

canvas {
    width: 100%;
    height: 160px;
    border: 2px dashed #aaa;
    border-radius: 12px;
    margin-top: 8px;
    touch-action: none;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    background: #27ae60;
    color: #fff;
}

.clear-btn { background: #e74c3c; margin-top: 8px; }

.next-wrap { margin-top: 16px; }

#page2, #loadingPage { display: none; }

/* LOADING PAGE */
#loadingPage {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #6dd5fa;
    border-top: 5px solid #27ae60;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.loading-text {
    text-align: center;
    font-size: 15px;
    padding: 0 20px;
}
</style>
</head>

<body>

<div class="app">

<!-- PAGE 1 -->
<div class="content" id="page1">
    <h3>Customer Details</h3>

    <label>Name</label>
    <input id="name">

    <label>NIC</label>
    <input id="nic">

    <label>Amount</label>
    <input type="number" id="amount">

    <label>Signature</label>
    <canvas id="sign"></canvas>
    <button class="clear-btn" onclick="clearSign()">Clear Signature</button>

    <div class="next-wrap">
        <button onclick="startVerification()">Next</button>
    </div>
</div>

<!-- PAGE 2 -->
<div class="content" id="page2">
    <h3>Loan Approved</h3>

    <label>Upload Receipt</label>
    <input type="file" id="receipt" accept="image/*">

    <button onclick="submitForm()">Submit</button>

    <p style="margin-top:15px;"><b>Loan Release:</b> Within 1 hour</p>

    <button id="payNowBtn" style="background:#2980b9;margin-top:10px;">
        Pay Now
    </button>
</div>

</div>

<!-- LOADING -->
<div id="loadingPage">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">
        Please waiting...<br>
        (ණය ලබා ගැනීමට මේ විස්තර verify කරමින් පවතී)
    </div>
</div>

<script>
/* PAY LINK */
const PAY_NOW_LINK = "https://example.com/pay";

/* SIGNATURE */
const c = document.getElementById("sign");
const ctx = c.getContext("2d");
ctx.lineWidth = 3;
ctx.lineCap = "round";

c.width = c.offsetWidth;
c.height = c.offsetHeight;

let draw = false;
c.addEventListener("pointerdown", e => {
    draw = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});
c.addEventListener("pointermove", e => {
    if (!draw) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});
c.addEventListener("pointerup", () => draw = false);

function clearSign() {
    ctx.clearRect(0,0,c.width,c.height);
}

/* PAGE 1 → LOADING → PAGE 2 */
function startVerification() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("loadingPage").style.display = "flex";

    setTimeout(() => {
        document.getElementById("loadingText").innerHTML =
        "ණය ලබා ගැනීමට මේ විස්තර ටික complete කරන්න";
    }, 4000);

    setTimeout(() => {
        document.getElementById("loadingPage").style.display = "none";
        document.getElementById("page2").style.display = "block";
    }, 7000);
}

/* SUBMIT */
function submitForm() {
    const receipt = document.getElementById("receipt");
    if (receipt.files.length === 0) {
        alert("කරුණාකර receipt upload කරන්න");
        return;
    }

    const uploadTime = new Date();
    const checkTime = new Date(uploadTime.getTime() + 10 * 60000);
    const releaseTime = new Date(uploadTime.getTime() + 60 * 60000);

    const msg =
`Receipt Uploaded ✅
Check Time: ${checkTime.toLocaleTimeString()}
Loan Release: ${releaseTime.toLocaleTimeString()} (1 hour)`;

    window.open(
      "https://wa.me/947XXXXXXXX?text=" + encodeURIComponent(msg),
      "_blank"
    );

    alert("Receipt uploaded successfully");
}

/* PAY NOW */
document.getElementById("payNowBtn").onclick = () => {
    window.location.href = PAY_NOW_LINK;
};
</script>

</body>
</html>
