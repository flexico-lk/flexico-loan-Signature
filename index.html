<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">

<!-- MOBILE ZOOM FIX -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Ez Credit App</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: system-ui, Arial;
    background: #eaeef3;
}

.app {
    max-width: 420px;
    margin: auto;
    min-height: 100svh;
    background: #fff;
    display: flex;
    flex-direction: column;
}

.content {
    padding: 16px;
    flex: 1;
    overflow-y: auto;
    width: 100%;
}

h3 {
    text-align: center;
    margin-bottom: 12px;
}

label {
    display: block;
    font-weight: 600;
    margin-top: 14px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px; /* STOP MOBILE ZOOM */
    display: block;
}

.statement {
    margin-top: 15px;
    padding: 12px;
    background: #f4f6f8;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
}

/* SIGNATURE */
canvas {
    width: 100%;
    height: 160px;
    border: 2px dashed #aaa;
    border-radius: 12px;
    margin-top: 8px;
    touch-action: none;
    background: #fff;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    background: #27ae60;
    color: #fff;
}

.clear-btn {
    background: #e74c3c;
    margin-top: 8px;
}

.next-wrap {
    position: sticky;
    bottom: 0;
    background: #fff;
    padding-top: 12px;
}

button:disabled {
    background: #bdc3c7;
}

#page2 {
    display: none;
}

#payNowBtn {
    background: #2980b9;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

<!-- PAGE 1 -->
<div class="content" id="page1">
    <h3>Customer Details</h3>

    <label>Name</label>
    <input id="name" autocomplete="off">

    <label>NIC Number</label>
    <input id="nic" autocomplete="off">

    <label>Request Amount (Rs)</label>
    <input type="number" id="amount">

    <div class="statement">
        මා විසින් ලබාගන්නා මෙම මුදල, සඳහන් පොලී අනුපාතයන්ට එකඟව ගෙවන බවට මෙයින් පොරොන්දු වෙමි.
    </div>

    <label>Signature</label>
    <canvas id="sign"></canvas>
    <button class="clear-btn" onclick="clearSign()">Clear Signature</button>

    <div class="next-wrap">
        <button onclick="nextPage()">Next</button>
    </div>
</div>

<!-- PAGE 2 -->
<div class="content" id="page2">
    <h3>Loan Approved</h3>

    <p><b>Requested Amount:</b> Rs. <span id="showAmount"></span></p>
    <p><b>Insurance:</b> Rs. <span id="insurance"></span></p>

    <div class="statement">
        ඔබගේ ණය ඉල්ලීම අනුමත වී ඇත.<br><br>
        රක්ෂණ මුදල ගෙවීමෙන් පසු පැය 1ක් ඇතුළත මුදල් ඔබගේ ගිණුමට බැර කරනු ලැබේ.
    </div>

    <label>Upload Receipt</label>
    <input type="file" id="receipt" accept="image/*">

    <div class="next-wrap">
        <button onclick="submitForm()">Submit</button>
    </div>

    <div style="margin-top:10px;">
        <p><b>Payment Deadline:</b> <span id="deadline">--:--</span></p>
        <button id="payNowBtn" disabled>Pay Now</button>
    </div>
</div>

</div>

<script>
/* SIGNATURE */
const c = document.getElementById("sign");
const ctx = c.getContext("2d");

ctx.lineWidth = 3;
ctx.lineCap = "round";
ctx.strokeStyle = "#000";

function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    c.width = c.offsetWidth * ratio;
    c.height = c.offsetHeight * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
resizeCanvas();

let drawing = false;

c.addEventListener("pointerdown", e => {
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

c.addEventListener("pointermove", e => {
    if (!drawing) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});

c.addEventListener("pointerup", () => drawing = false);
c.addEventListener("pointerleave", () => drawing = false);

function clearSign() {
    ctx.clearRect(0, 0, c.width, c.height);
}

/* PAGE CHANGE */
function nextPage() {
    const name = document.getElementById("name").value.trim();
    const nic = document.getElementById("nic").value.trim();
    const amount = document.getElementById("amount").value;

    if (!name || !nic || !amount) {
        alert("කරුණාකර සියලු fields පුරවන්න");
        return;
    }

    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";

    document.getElementById("showAmount").innerText = amount;
    document.getElementById("insurance").innerText = calc(amount);
}

/* INSURANCE CALC */
function calc(a) {
    a = parseInt(a);
    if (a <= 60000) return "2,500";
    if (a <= 100000) return "3,500";
    if (a <= 200000) return "4,000";
    return "5,000";
}

/* SUBMIT */
function submitForm() {
    const receipt = document.getElementById("receipt");
    const deadlineEl = document.getElementById("deadline");
    const payBtn = document.getElementById("payNowBtn");

    if (receipt.files.length === 0) {
        alert("Receipt upload කරන්න");
        return;
    }

    const now = new Date();
    const end = new Date(now.getTime() + 60 * 60 * 1000);

    deadlineEl.innerText =
        end.getHours().toString().padStart(2,"0") + ":" +
        end.getMinutes().toString().padStart(2,"0");

    payBtn.disabled = false;
    payBtn.onclick = () => {
        window.location.href = "payment_page.html";
    };

    alert("Receipt uploaded. Pay Now click කරන්න.");
}
</script>

</body>
</html>
