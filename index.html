<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ez Credit App</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: system-ui, Arial;
    background: #eaeef3;
}

.app {
    max-width: 420px;
    margin: auto;
    min-height: 100svh;
    background: #fff;
    display: flex;
    flex-direction: column;
}

.header {
    height: 0px;
}

.content {
    padding: 20px;
    flex: 1;
    overflow-y: auto;
}

h3 { text-align: center; margin-bottom: 10px; }

label {
    display: block;
    font-weight: 600;
    margin-top: 14px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.statement {
    margin-top: 15px;
    padding: 12px;
    background: #f4f6f8;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
}

canvas {
    width: 100%;
    height: 120px;
    border: 2px dashed #aaa;
    border-radius: 12px;
    margin-top: 8px;
    touch-action: none;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    background: #27ae60;
    color: #fff;
}

.clear-btn {
    background: #e74c3c;
    margin-top: 8px;
}

.next-wrap {
    position: sticky;
    bottom: 0;
    background: #fff;
    padding: 15px 0;
}

button:disabled {
    background: #bdc3c7;
    cursor: not-allowed;
}

#page2 { display: none; }

#payNowBtn {
    background: #2980b9;
    margin-top: 10px;
}

#loading {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.spinner {
    width: 28px;
    height: 28px;
    border: 4px solid #ccc;
    border-top: 4px solid #27ae60;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="app">

    <!-- PAGE 01 -->
    <div class="content" id="page1">
        <h3>Customer Details</h3>

        <label>Name</label>
        <input id="name">

        <label>NIC Number</label>
        <input id="nic">

        <label>Request Amount (Rs)</label>
        <input type="number" id="amount">

        <div class="statement">
            මා විසින් ලබාගන්නා මෙම මුදල, සඳහන් පොලී අනුපාතයන්ට එකඟව ගෙවන බවට මෙයින් පොරොන්දු වෙමි.
        </div>

        <label>Signature</label>
        <canvas id="sign"></canvas>
        <button class="clear-btn" onclick="clearSign()">Clear Signature</button>

        <div class="next-wrap">
            <button onclick="nextPage()">Next</button>
        </div>
    </div>

    <!-- PAGE 02 -->
    <div class="content" id="page2">
        <h3>Loan Approved</h3>

        <p><b>Requested Amount:</b> Rs. <span id="showAmount"></span></p>
        <p><b>Insurance:</b> Rs. <span id="insurance"></span></p>

        <div class="statement">
            ඔබගේ ණය ඉල්ලීම අනුමත වී ඇත.<br><br>
            රක්ෂණ මුදල ගෙවීමෙන් පසු පැය 1ක් ඇතුළත මුදල් ඔබගේ ගිණුමට බැර කරනු ලැබේ.
        </div>

        <label>Upload Receipt</label>
        <input type="file" id="receipt">

        <div class="next-wrap">
            <button onclick="submitForm()">Submit</button>
        </div>

        <!-- PAYMENT SECTION (ALWAYS VISIBLE) -->
        <div id="paymentSection" style="margin-top:10px;">
            <p><b>Payment Deadline:</b> <span id="deadline">--:--</span></p>
            <button id="payNowBtn" disabled>Pay Now</button>
        </div>
    </div>

</div>

<div id="loading">
    <div class="spinner"></div>
</div>

<script>
/* Signature */
const c = document.getElementById("sign");
const ctx = c.getContext("2d");
c.width = c.offsetWidth;
c.height = c.offsetHeight;
let draw = false;

c.addEventListener("pointerdown", e => {
    draw = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

c.addEventListener("pointermove", e => {
    if (!draw) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});

c.addEventListener("pointerup", () => draw = false);
c.addEventListener("pointerleave", () => draw = false);

function clearSign() {
    ctx.clearRect(0, 0, c.width, c.height);
}

/* Page change */
function nextPage() {
    const name = document.getElementById("name").value;
    const nic = document.getElementById("nic").value;
    const amount = document.getElementById("amount").value;

    if (!name || !nic || !amount) {
        alert("කරුණාකර සියලු fields පුරවන්න");
        return;
    }

    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";

    document.getElementById("showAmount").innerText = amount;
    document.getElementById("insurance").innerText = calc(amount);
}

/* Insurance calc */
function calc(a) {
    a = parseInt(a);
    if (a <= 60000) return "2,500";
    if (a <= 100000) return "3,500";
    if (a <= 200000) return "4,000";
    return "5,000";
}

/* Submit */
function submitForm() {
    const receipt = document.getElementById("receipt");
    const deadlineEl = document.getElementById("deadline");
    const payBtn = document.getElementById("payNowBtn");

    if (receipt.files.length === 0) {
        alert("කරුණාකර receipt image එක upload කරන්න");
        return;
    }

    const now = new Date();
    const oneHourLater = new Date(now.getTime() + 60 * 60 * 1000);

    const h = oneHourLater.getHours().toString().padStart(2, '0');
    const m = oneHourLater.getMinutes().toString().padStart(2, '0');

    deadlineEl.innerText = `${h}:${m} (1 hour within)`;

    payBtn.disabled = false;
    payBtn.onclick = () => {
        window.location.href = "payment_page.html";
    };

    alert("Receipt uploaded successfully. දැන් Pay Now click කර payment කරන්න.");
}
</script>

</body>
</html>
