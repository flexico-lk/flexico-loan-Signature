<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ez Credit App</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: system-ui, Arial;
    background: #eaeef3;
}

.app {
    max-width: 420px;
    margin: auto;
    min-height: 100vh;
    background: #fff;
    padding: 20px;
}

h3 {
    text-align: center;
    margin-bottom: 10px;
}

label {
    display: block;
    font-weight: 600;
    margin-top: 14px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
}

.statement {
    margin-top: 15px;
    padding: 14px;
    background: #f4f6f8;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
}

canvas {
    width: 100%;
    height: 120px;
    border: 2px dashed #aaa;
    border-radius: 12px;
    margin-top: 8px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    background: #27ae60;
    color: #fff;
    margin-top: 12px;
}

#payNowBtn {
    background: #2980b9;
}

.clear-btn {
    background: #e74c3c;
}

.result {
    margin-top: 20px;
    padding: 12px;
    background: #dfe6e9;
    border-radius: 12px;
}
</style>
</head>
<body>
<div class="app">
    <h3>Customer Details & Loan Confirmation</h3>

    <label>Name</label>
    <input id="name">

    <label>NIC Number</label>
    <input id="nic">

    <label>Request Amount (Rs)</label>
    <input type="number" id="amount">

    <div class="statement">
        මා විසින් ලබාගන්නා මෙම මුදල, සඳහන් කොන්දේසි වලට එකඟව ගෙවන බවට මෙයින් පොරොන්දු වෙමි.
    </div>

    <label>Signature</label>
    <canvas id="sign"></canvas>
    <button class="clear-btn" onclick="clearSign()">Clear Signature</button>

    <button onclick="showDetails()">Show Confirmation</button>

    <div class="result" id="confirmation" style="display:none;">
        <p><b>Name:</b> <span id="showName"></span></p>
        <p><b>NIC Number:</b> <span id="showNIC"></span></p>
        <p><b>Requested Amount:</b> Rs. <span id="showAmount"></span></p>
        <p><b>Insurance Amount:</b> Rs. <span id="insurance"></span></p>

        <div class="statement">
            ඔබ ලබා දුන් තොරතුරු තහවුරු කරමින් මෙම මුදල ඉල්ලීම් වලට අනුකූලව ගෙවීමට සූදානම් බව සනාථ කරමි.
        </div>

        <button id="payNowBtn" onclick="goToPayment()">Pay Now</button>

        <label>Upload Payment Receipt</label>
        <input type="file" id="receipt">

        <button onclick="submitForm()">Submit</button>
    </div>
</div>

<script>
/* Signature */
const c = document.getElementById("sign");
const ctx = c.getContext("2d");
c.width = c.offsetWidth;
c.height = c.offsetHeight;
let draw = false;

c.addEventListener("pointerdown", e => {
    draw = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});
c.addEventListener("pointermove", e => {
    if (!draw) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});
c.addEventListener("pointerup", () => draw = false);
c.addEventListener("pointerleave", () => draw = false);

function clearSign() {
    ctx.clearRect(0, 0, c.width, c.height);
}

/* Show confirmation */
function showDetails() {
    const name = document.getElementById("name").value.trim();
    const nic = document.getElementById("nic").value.trim();
    const amount = document.getElementById("amount").value.trim();

    if(!name || !nic || !amount) {
        alert("කරුණාකර සියලු fields පුරවන්න");
        return;
    }

    // Check signature
    const sigData = ctx.getImageData(0,0,c.width,c.height).data;
    if(sigData.every(v=>v===0)) {
        alert("කරුණාකර signature එක ලබා දෙන්න");
        return;
    }

    document.getElementById("showName").innerText = name;
    document.getElementById("showNIC").innerText = nic;
    document.getElementById("showAmount").innerText = amount;
    document.getElementById("insurance").innerText = calcInsurance(amount);

    document.getElementById("confirmation").style.display = "block";
}

/* Insurance calc */
function calcInsurance(a) {
    a = parseInt(a);
    if (a <= 60000) return "2,500";
    if (a <= 100000) return "3,500";
    if (a <= 200000) return "4,000";
    return "5,000";
}

/* Pay */
function goToPayment() {
    window.location.href = "payment_page.html";
}

/* Submit */
function submitForm() {
    const receipt = document.getElementById("receipt");
    if(receipt.files.length === 0) {
        alert("Payment කරලා receipt image එක upload කරන්න");
        return;
    }
    alert("Receipt received. පැය 1ක් ඇතුළත මුදල් ඔබගේ ගිණුමට බැර කරනු ලැබේ.");
}
</script>
</body>
</html>
