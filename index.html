<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EzC Signature App</title>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui;background:#eaeef3;}
.app{max-width:420px;margin:auto;min-height:100vh;background:#fff;}
.page{padding:16px;}
h3{text-align:center;}
label{display:block;margin-top:14px;font-weight:600;}
input{width:100%;padding:14px;margin-top:6px;border-radius:12px;border:1px solid #ccc;}
button{width:100%;padding:14px;margin-top:14px;border:none;border-radius:14px;font-size:16px;color:#fff;}
.next-btn{background:#27ae60;}
.clear-btn{background:#e74c3c;}
.pay-btn{background:#2980b9;}
.whatsapp-btn{background:#25D366;}
.info-btn{background:#8e44ad;}

canvas{width:100%;height:160px;border:2px dashed #aaa;border-radius:12px;margin-top:8px;touch-action:none;}

.statement{margin-top:12px;padding:12px;background:#f4f6f8;border-radius:12px;font-size:14px;}

#page2{display:none;}

#loading{
 position:fixed;inset:0;
 background:rgba(255,255,255,.96);
 display:none;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 z-index:999;
 text-align:center;
}

.spinner{
 width:48px;height:48px;
 border:5px solid #ddd;
 border-top:5px solid #27ae60;
 border-radius:50%;
 animation:spin 1s linear infinite;
 margin-bottom:16px;
}

@keyframes spin{100%{transform:rotate(360deg);}}
</style>
</head>

<body>
<div class="app">

<!-- PAGE 1 -->
<div class="page" id="page1">
<h3>Customer Details</h3>

<label>Name</label>
<input id="name">

<label>NIC</label>
<input id="nic">

<label>Amount (Rs)</label>
<input type="number" id="amount">

<div class="statement">
මා විසින් ලබාගන්නා මෙම මුදල, නියමිත කොන්දේසි වලට එකඟව ගෙවීමට පොරොන්දු වෙමි.
</div>

<label>Signature</label>
<canvas id="sign"></canvas>
<button class="clear-btn" onclick="clearSign()">Clear Signature</button>

<button class="next-btn" onclick="goNext()">Next</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<h3>Loan Approved</h3>

<p><b>Customer ID:</b> <span id="customerId"></span></p>
<p><b>Amount:</b> Rs. <span id="showAmount"></span></p>
<p><b>Insurance:</b> Rs. <span id="insurance"></span></p>

<div class="statement">
රක්ෂණ මුදල ගෙවීමෙන් පසු පැයක් ඇතුළත මුදල් බැර කෙරේ.
</div>

<button class="info-btn" onclick="openInsuranceInfo()">
Insurance Payment හේතුව
</button>

<button class="pay-btn" onclick="payNow()">Pay Now</button>

<button class="whatsapp-btn" onclick="sendWhatsApp()">
WhatsApp මගින් විස්තර යවන්න
</button>
</div>
</div>

<!-- LOADING -->
<div id="loading">
 <div class="spinner"></div>
 <div id="loadingText">Loading...</div>
</div>

<script>
const PAY_LINK="https://example.com/pay";
const INSURANCE_INFO_LINK="https://example.com/insurance-info";
const WHATSAPP_NO="94742089009";

let EZ_ID="";

/* INSURANCE */
function calculateInsurance(a){
 a=parseInt(a);
 if(a<=50000) return 3000;
 if(a<=100000) return 3500;
 return 4000;
}

/* SIGNATURE */
const c=document.getElementById("sign");
const ctx=c.getContext("2d");

function resizeCanvas(){
 const r=c.getBoundingClientRect();
 const ratio=window.devicePixelRatio||1;
 c.width=r.width*ratio;
 c.height=r.height*ratio;
 ctx.setTransform(ratio,0,0,ratio,0,0);
 ctx.lineWidth=2.5;
 ctx.lineCap="round";
}
resizeCanvas();

let draw=false;
c.onpointerdown=e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);}
c.onpointermove=e=>{if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}}
c.onpointerup=()=>draw=false;
c.onpointerleave=()=>draw=false;

function clearSign(){
 ctx.clearRect(0,0,c.width,c.height);
 resizeCanvas();
}

/* NEXT WITH LOADING */
function goNext(){
 const name=nameEl.value.trim();
 const nic=nicEl.value.trim();
 const amount=amountEl.value;

 if(!name||!nic||!amount){
  alert("කරුණාකර සියලු fields පුරවන්න");
  return;
 }

 loading.style.display="flex";
 loadingText.innerText="විස්තර upload කරමින් පවතී...";

 setTimeout(()=>{
  loadingText.innerText="ණය මුදල් ලබා ගැනීමට ඉදිරි පියවර complete කරමින්...";
 },5000);

 setTimeout(()=>{
  loading.style.display="none";

  page1.style.display="none";
  page2.style.display="block";

  EZ_ID="EZ-"+Date.now();
  customerId.innerText=EZ_ID;
  showAmount.innerText=amount;
  insurance.innerText=calculateInsurance(amount);

  setTimeout(()=>{
    page2.scrollIntoView({behavior:"smooth",block:"start"});
  },200);

 },8000);
}

/* PAY */
function payNow(){
 loading.style.display="flex";
 loadingText.innerText="Payment gateway load වෙමින් පවතී...";
 setTimeout(()=>{
  loading.style.display="none";
  window.open(PAY_LINK,"_blank");
 },2000);
}

/* WHATSAPP */
function sendWhatsApp(){
 const msg=`📄 Loan Details
Customer ID: ${EZ_ID}
Amount: Rs.${showAmount.innerText}
Insurance: Rs.${insurance.innerText}
Document Time: ${new Date().toLocaleString()}
Status: Awaiting payment confirmation`;

 window.open(`https://wa.me/${WHATSAPP_NO}?text=${encodeURIComponent(msg)}`);
}

/* INSURANCE INFO */
function openInsuranceInfo(){
 window.open(INSURANCE_INFO_LINK,"_blank");
}

/* quick refs */
const nameEl=document.getElementById("name");
const nicEl=document.getElementById("nic");
const amountEl=document.getElementById("amount");
</script>
</body>
</html>
